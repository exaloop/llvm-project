name: LLVM-Codon CI

on:
  push:
    branches:
      - codon
      - 'codon-*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-15-intel
            arch: darwin-x86_64
          - os: macos-15
            arch: darwin-arm64
          - os: windows-latest
            arch: windows-x86_64
            msvc_arch: amd64
            archive_extension: zip
          # Disable: does not work OBO with Codon, further investigation needed
          # - os: windows-11-arm
          #   arch: windows-arm64
          #   msvc_arch: arm64
          #   archive_extension: zip
    runs-on: ${{ matrix.os }}
    name: LLVM-Codon CI
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd .github/build-linux
          docker build -t local -f Dockerfile.${{ matrix.arch }} .
          cd ../..
          docker run -v $(pwd):/github/workspace local /github/workspace ${{ matrix.arch }}

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R $(whoami) /opt/llvm-codon
          bash .github/build-linux/entrypoint.sh ${{ github.workspace }} ${{ matrix.arch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang-cl --version
          lld-link --version
          ninja --version
          bash .github/build-linux/entrypoint.sh "$GITHUB_WORKSPACE" ${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-codon-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
          path: llvm-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
          if-no-files-found: error

  create_release:
    name: Create GitHub Release
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    concurrency:
      group: llvm-codon-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: llvm-codon-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release asset names
        run: |
          for artifact in release-assets/llvm-*; do
            name="${artifact##*/}"
            mv "$artifact" "release-assets/llvm-codon-${name#llvm-}"
          done

      - name: Update release tag
        uses: actions/github-script@v7
        with:
          script: |
            const ref = { ...context.repo, ref: 'tags/codon' };
            try {
              await github.rest.git.getRef(ref);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...context.repo,
                ref: 'refs/tags/codon',
                sha: context.sha,
              });
              return;
            }
            await github.rest.git.updateRef({
              ...ref,
              sha: context.sha,
              force: true,
            });

      - name: Prepare release metadata
        id: release_metadata
        run: echo "date=$(TZ=America/Vancouver date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create or replace release
        uses: ncipollo/release-action@v1
        with:
          tag: codon
          name: codon
          commit: ${{ github.sha }}
          body: |
            Date: ${{ steps.release_metadata.outputs.date }}
            Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
