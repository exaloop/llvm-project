name: LLVM-Codon CI

on:
  push:
    branches:
      - codon
      - 'codon-*'
    tags:
      - '*'

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    permissions:
      contents: write
    steps:
      - name: Create Release
        if: contains(github.event.head_commit.message, '[release]')
        id: create_release
        uses: ncipollo/release-action@v1

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-15-intel
            arch: darwin-x86_64
          - os: macos-14
            arch: darwin-arm64
          - os: windows-latest
            arch: windows-x86_64
            msvc_arch: amd64
            archive_extension: zip
          - os: windows-11-arm
            arch: windows-arm64
            msvc_arch: arm64
            archive_extension: zip
    runs-on: ${{ matrix.os }}
    name: LLVM-Codon CI
    needs: create_release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd .github/build-linux
          docker build -t local -f Dockerfile.${{ matrix.arch }} .
          cd ../..
          docker run -v $(pwd):/github/workspace local /github/workspace ${{ matrix.arch }}

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R $(whoami) /opt/llvm-codon
          bash .github/build-linux/entrypoint.sh ${{ github.workspace }} ${{ matrix.arch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang-cl --version
          lld-link --version
          ninja --version
          bash .github/build-linux/entrypoint.sh "$GITHUB_WORKSPACE" ${{ matrix.arch }}

      - name: Upload Release Asset
        if: contains(github.event.head_commit.message, '[release]')
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./llvm-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
          asset_name: llvm-${{ github.ref_name }}-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
          asset_content_type: ${{ matrix.archive_extension == 'zip' && 'application/zip' || 'application/bzip2' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ github.ref_name }}-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
          path: llvm-${{ matrix.arch }}.${{ matrix.archive_extension || 'tar.bz2' }}
